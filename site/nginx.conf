server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Downloads go through the site so every click shows up in the request
    # logs — that is the download counter. The real bytes come from GCS.
    location = /download/windows {
        return 302 https://storage.googleapis.com/getbedrock-downloads/Bedrock-Setup-0.1.0.exe;
    }

    location = /download/mac {
        return 302 https://storage.googleapis.com/getbedrock-downloads/Bedrock-0.1.0-arm64.dmg;
    }
}
