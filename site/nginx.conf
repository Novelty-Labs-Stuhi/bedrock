# Cloud Run terminates the connection in front of us, so $remote_addr is always
# a Google frontend. limit_req needs the real client, which only exists in XFF.
# Trusting XFF wholesale means it can be spoofed on a direct run.app request —
# acceptable here, because the limit below is a speed bump and not a boundary.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# This only limits how fast one IP is handed the redirect. It cannot limit the
# transfer itself: the dmg bytes come straight from GCS, which has no per-IP
# throttle. Real egress protection would mean signed URLs, or a load balancer
# with Cloud Armor in front of the bucket.
limit_req_zone $binary_remote_addr zone=downloads:10m rate=10r/m;
limit_req_status 429;

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Downloads go through the site so every click lands in the request logs.
    # Downloads that actually finished are counted from the bucket's own usage
    # logs instead — see scripts/download-count.sql.
    #
    # The try_files hop is load-bearing: `return` is handled in the rewrite
    # phase, which runs before the preaccess phase where limit_req lives, so a
    # `return` in this block would skip the limit silently. Bouncing through a
    # named location pushes the redirect past it.
    location = /download/mac {
        limit_req zone=downloads burst=5 nodelay;
        try_files /nonexistent @mac;
    }

    location @mac {
        return 302 https://storage.googleapis.com/getbedrock-downloads/Bedrock-0.1.0-arm64.dmg;
    }

    # The counter the homepage reads. Proxied rather than redirected so the page
    # can fetch it same-origin without CORS configured on the bucket.
    #
    # try_files first so a counts.json dropped into the image wins — that is how
    # the page is previewed locally without touching the bucket. Nothing commits
    # such a file, so in production this always falls through to the proxy.
    location = /counts.json {
        try_files $uri @counts;
    }

    location @counts {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        # Via a variable on purpose: a literal proxy_pass with a URI path is
        # rejected inside a named location. Going through $counts_url also forces
        # runtime DNS through the resolver above rather than a startup lookup.
        set $counts_url https://storage.googleapis.com/getbedrock-downloads/counts.json;
        proxy_pass $counts_url;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_hide_header x-goog-hash;
        proxy_hide_header x-guploader-uploadid;
        # Browser-side only — there is no proxy_cache zone here, so every cold
        # visit is one small bucket read. Fine at this size.
        add_header Cache-Control "public, max-age=300" always;
    }
}
