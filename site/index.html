<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bedrock — the graph is the app</title>
    <meta
      name="description"
      content="A markdown vault whose graph is the place you work — spatial, durable, plain files."
    />
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <meta property="og:title" content="Bedrock — the graph is the app" />
    <meta
      property="og:description"
      content="A markdown vault whose graph is the place you work — spatial, durable, plain files."
    />
    <meta property="og:image" content="bg.jpg" />
    <meta property="og:type" content="website" />
    <style>
      :root {
        --ink: #16171b;
        --muted: rgba(22, 23, 27, 0.64);
        --faint: rgba(22, 23, 27, 0.5);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        /* Also what shows while the backdrop is still loading. */
        background: #eceef0;
        -webkit-font-smoothing: antialiased;
      }

      /*
       * The backdrop is a screenshot of a real vault, blurred just far enough to stop
       * competing with the words in front of it. `scale` overshoots the
       * viewport because `filter: blur()` samples the transparency beyond an element's
       * edges, which would otherwise fade the border into the page background.
       */
      .backdrop {
        position: fixed;
        inset: 0;
        background: url("bg.jpg") center / cover no-repeat;
        /* Barely there — enough to take the edge off the type in the screenshot,
           not enough to stop it reading as a vault. No colour treatment: the tone
           on screen is the tone the app actually has. */
        filter: blur(4px);
        transform: scale(1.02);
      }

      /* The backdrop is fixed and painted first; content sits above it. */
      header, main { position: relative; z-index: 1; }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.35rem clamp(1.1rem, 5vw, 3rem);
      }

      .wordmark {
        color: var(--ink);
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
      }

      nav a {
        color: var(--muted);
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: none;
        padding: 0.5rem 0.85rem;
        border-radius: 10px;
        transition: color 0.15s ease, background 0.15s ease;
      }

      nav a:hover { color: var(--ink); background: rgba(22, 23, 27, 0.07); }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1rem clamp(1.1rem, 5vw, 3rem) clamp(3rem, 11vh, 6.5rem);
      }

      .mark {
        width: clamp(92px, 13vw, 132px);
        height: auto;
        filter: drop-shadow(0 16px 36px rgba(24, 22, 12, 0.28));
      }

      h1 {
        margin: 1.7rem 0 0;
        font-size: clamp(2.7rem, 8vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .tagline {
        margin: 1.15rem 0 0;
        max-width: 34ch;
        font-size: clamp(1.02rem, 2.4vw, 1.2rem);
        line-height: 1.55;
        color: var(--muted);
        text-wrap: balance;
      }

      /*
       * Frosted so it reads as sitting on the vault screenshot rather than on a
       * card of its own. Starts hidden and is only revealed once a real number
       * arrives — see the script at the end of the body.
       */
      .counter {
        margin: 1.9rem 0 0;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.42rem 0.9rem 0.42rem 0.72rem;
        border-radius: 999px;
        font-size: 0.875rem;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.72);
        box-shadow: 0 1px 2px rgba(20, 21, 28, 0.05), 0 10px 24px rgba(20, 21, 28, 0.08);
        backdrop-filter: blur(14px) saturate(150%);
        -webkit-backdrop-filter: blur(14px) saturate(150%);
        animation: counter-in 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      .counter[hidden] { display: none; }

      /* Tightens the gap only when the pill is actually there. */
      .counter:not([hidden]) + .actions { margin-top: 1.6rem; }

      .counter__pulse {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2f9e68;
        animation: counter-pulse 2.6s ease-out infinite;
      }

      /* tabular-nums so the digits do not jitter while counting up. */
      .counter__value {
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .counter__label { color: var(--muted); }

      @keyframes counter-in {
        from { opacity: 0; transform: translateY(7px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }

      @keyframes counter-pulse {
        0% { box-shadow: 0 0 0 0 rgba(47, 158, 104, 0.5); }
        70% { box-shadow: 0 0 0 7px rgba(47, 158, 104, 0); }
        100% { box-shadow: 0 0 0 0 rgba(47, 158, 104, 0); }
      }

      /*
       * Two ways in, given equal room. Only one of them is an installer: the dashed
       * outline is what says "this one hands you a repo, not a download" without
       * needing a sentence to explain itself.
       */
      .actions {
        margin-top: 2.5rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: stretch;
        gap: 0.9rem;
      }

      .btn {
        /* A fixed basis rather than min-width: the two boxes match to the pixel
           instead of each sizing itself to its own label. */
        flex: 0 0 16rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem 1.5rem;
        /* Transparent on the solid button too, so both boxes measure the same. */
        border: 1.5px dashed transparent;
        border-radius: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-decoration: none;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease,
          border-color 0.15s ease;
      }

      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: translateY(0); }

      .btn .sub { margin-top: 0.15rem; font-size: 0.76rem; font-weight: 500; opacity: 0.62; }

      .btn--mac {
        background: #17181c;
        color: #fff;
        box-shadow: 0 10px 26px rgba(20, 21, 28, 0.26);
      }

      .btn--mac:hover { box-shadow: 0 16px 36px rgba(20, 21, 28, 0.34); }
      .btn--mac:active { box-shadow: 0 7px 18px rgba(20, 21, 28, 0.28); }

      .btn--win { border-color: rgba(22, 23, 27, 0.42); color: var(--ink); }
      .btn--win:hover { border-color: rgba(22, 23, 27, 0.72); background: rgba(22, 23, 27, 0.05); }

      /* Once they stack, the installer belongs on top whatever the source order is. */
      @media (max-width: 34rem) {
        .btn { flex: 1 1 100%; }
        .btn--mac { order: -1; }
      }

      .meta { margin: 1.05rem 0 0; font-size: 0.9rem; color: var(--muted); }

      .note { margin: 0.55rem 0 0; max-width: 42ch; font-size: 0.8rem; line-height: 1.55; color: var(--faint); }

      a:focus-visible, .download:focus-visible {
        outline: 2px solid rgba(22, 23, 27, 0.75);
        outline-offset: 3px;
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        /* The counter reveal and its pulse are animations, not transitions, so
           the rule above does not reach them. Collapsing the duration lands them
           on their final frame immediately. */
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop"></div>

    <header>
      <a class="wordmark" href="/">Bedrock</a>
      <nav>
        <a href="https://github.com/Novelty-Labs-Stuhi/bedrock" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main>
      <img class="mark" src="icon.png" alt="" width="132" height="132" />
      <h1>Bedrock</h1>
      <p class="tagline">
        A markdown vault whose graph is the place you work — spatial, durable, plain files.
      </p>
      <!--
        Hidden until the count is fetched, then shown whatever it says — zero is
        the truth until someone downloads, and a fabricated floor is worse. Only
        a missing or unreachable count leaves no trace.
      -->
      <p class="counter" id="counter" hidden>
        <span class="counter__pulse" aria-hidden="true"></span>
        <span class="counter__value" id="counterValue">0</span>
        <span class="counter__label">downloads</span>
      </p>
      <div class="actions">
        <!-- No Windows installer is published: the repo, and building it, is the honest answer. -->
        <a
          class="btn btn--win"
          href="https://github.com/Novelty-Labs-Stuhi/bedrock"
          target="_blank"
          rel="noopener"
        >
          Download for Windows
          <span class="sub">(cli)</span>
        </a>
        <!-- Through the site, not straight to the bucket: the redirect is the download counter. -->
        <a class="btn btn--mac" href="/download/mac">Download for Mac</a>
      </div>
      <p class="meta">macOS · Apple Silicon</p>
      <p class="note">
        Unsigned build. On first launch, open System Settings › Privacy &amp; Security and click
        Open Anyway.
      </p>
    </main>

    <script>
      /*
       * counts.json is published by scripts/publish-count.sh and served through
       * the site's own /counts.json route, so this is a same-origin fetch with no
       * CORS to configure. Everything here fails quietly: the pill simply never
       * appears if the count is missing, unreachable or still zero.
       */
      (function () {
        var pill = document.getElementById('counter');
        var out = document.getElementById('counterValue');
        if (!pill || !out || !window.fetch) return;

        var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function show(total) {
          out.textContent = total.toLocaleString('en-US');
          pill.hidden = false;
          if (still || total < 2) return;

          // Count up from a little below so the pill lands on its number rather
          // than arriving at it — starting from 0 reads as a loading state.
          var from = Math.max(0, total - Math.min(total, Math.ceil(total * 0.25) + 8));
          var start = performance.now();
          (function step(now) {
            var t = Math.min(1, (now - start) / 900);
            var eased = 1 - Math.pow(1 - t, 3);
            out.textContent = Math.round(from + (total - from) * eased).toLocaleString('en-US');
            if (t < 1) requestAnimationFrame(step);
          })(start);
        }

        fetch('/counts.json', { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            // Shown whenever a real count came back, zero included. Only a
            // missing or unreachable count leaves the pill hidden.
            if (data && typeof data.total === 'number') show(data.total);
          })
          .catch(function () {});
      })();
    </script>
  </body>
</html>
