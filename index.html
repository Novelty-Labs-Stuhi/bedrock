<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedrock</title>
  </head>
  <body>
    <div id="app">
      <!-- Retired chrome: the tree still renders in here (the logic is load-bearing),
           but the stylesheet never draws it. The app is the graph. -->
      <aside id="sidebar" aria-hidden="true">
        <div class="vault">
          <button id="fold-side" class="rail-btn" title="Collapse sidebar">⟨</button>
          <span id="vault-name">local vault</span>
        </div>
        <div class="toolbar">
          <button id="new-folder" title="New folder in the selected folder">＋ Folder</button>
          <button id="graph" title="Open graph view">Graph</button>
        </div>
        <div id="crumb">/</div>
        <nav id="tree"></nav>
      </aside>
      <div id="side-resize"></div>

      <main id="main">
        <!-- Shown only in a plain browser tab; the desktop app has real menus for both. -->
        <div id="float-controls">
          <button id="open-folder" title="Open a folder from disk">Open vault…</button>
          <button id="settings" title="Settings">⚙</button>
        </div>

        <!-- The front door. No vault opens by itself: the app starts here, and File →
             Open Vault… comes back here (the picker needs a real click to open). -->
        <div id="welcome">
          <button id="welcome-open" class="welcome-btn">
            <b>Open a vault</b>
            <small>a folder of notes on this disk</small>
          </button>
          <button id="welcome-new" class="welcome-btn">
            <b>Create a new vault</b>
            <small>make a fresh folder right in the picker — New Folder, then Open</small>
          </button>
        </div>
        <div id="panes">
          <section class="pane" id="pane-0">
            <div class="tabbar">
              <div class="tabs" id="tabs-0"></div>
              <div class="tab-actions" id="actions-0"></div>
            </div>
            <div class="view">
              <div class="page" id="page-0">
                <div class="editor" id="editor-0"></div>
              </div>
              <div class="pane-empty hidden" id="empty-0">Open a note</div>
              <div id="cy" class="hidden"></div>
            </div>
          </section>

          <div id="splitter" class="hidden" title="Drag to resize the panes"></div>

          <section class="pane hidden" id="pane-1">
            <div class="tabbar">
              <div class="tabs" id="tabs-1"></div>
              <div class="tab-actions" id="actions-1"></div>
            </div>
            <div class="view">
              <div class="page" id="page-1">
                <div class="editor" id="editor-1"></div>
              </div>
              <div class="pane-empty hidden" id="empty-1">Open a note</div>
            </div>
          </section>
        </div>
        <div id="status"></div>
      </main>
    </div>

    <!-- Settings is a window, not a drawer: it is about the whole app, so it opens in
         the middle of the whole app rather than hanging off the sidebar that opened it. -->
    <div id="settings-modal"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
