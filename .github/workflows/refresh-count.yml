name: Refresh download count

# Reads bytes served from Cloud Monitoring and republishes counts.json, which the
# homepage fetches. Monitoring has a download within a minute or two, so this
# schedule — not the data — is what bounds how fresh the number on the page is.
#
# Be aware GitHub's scheduler is best-effort: runs are frequently minutes late and
# can be dropped entirely when the platform is busy. Treat the count as accurate
# to the last quarter hour or so, not to the minute.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Recount from this RFC3339 time (blank = resume from the last run)"
        required: false
        default: ""

# Overlapping runs would each do the same work and publish the same number, so
# they are wasteful rather than wrong. Never cancel a run mid-upload.
concurrency:
  group: refresh-count
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: cleveland-464404-m0
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Publish the count
        # GCLOUD_ACCOUNT empty: use the ambient workload identity credentials
        # rather than the gmail account the script assumes when run by hand.
        env:
          GCLOUD_ACCOUNT: ""
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [ -n "$BACKFILL" ]; then
            python3 scripts/publish-count.py --backfill "$BACKFILL"
          else
            python3 scripts/publish-count.py
          fi
