name: Release macOS

# Fires on merges into main. A PR merge is a push to main, so this covers the
# "only through PRs" flow — but nothing *enforces* that until branch protection
# is on; a direct push to main would build and ship too.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      # Not scripts/** — that swept in the deploy and download-counting scripts,
      # so editing a bash script rebuilt, signed and notarized the whole dmg for
      # nothing. This is the only script the build actually uses.
      - "scripts/notarize-dmg.cjs"
      - "build/**"
      - "index.html"
      - "terminal.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      # listed so a change to this workflow rebuilds and proves itself
      - ".github/workflows/release-macos.yml"
  workflow_dispatch:

# Notarization is slow and the upload overwrites a fixed object name; two
# concurrent releases would race to decide which build wins.
concurrency:
  group: release-macos
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mints the OIDC token that Google exchanges for credentials

jobs:
  release:
    runs-on: macos-15 # arm64, matches the only target in package.json
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The updater in the app compares versions, so every build that ships has to carry
      # a new one. package.json keeps major.minor; the patch is this run's number, which
      # only goes up. Not committed back — the repo stays at x.y.0, the dmg says what it is.
      - name: Stamp the version
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          npm version "$base.$GITHUB_RUN_NUMBER" --no-git-tag-version
          echo "building $(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Throwaway keychain, throwaway password — both die with the runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # An empty secret decodes to an empty file and surfaces four lines later
          # as "SecKeychainItemImport: parameters not valid", which says nothing
          # about the real cause. Fail here instead.
          test -n "$CERT_P12_BASE64" || {
            echo "::error::APPLE_CERT_P12_BASE64 is empty — the secret was never set, or was set from an empty pipe"
            exit 1
          }
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          size="$(wc -c < "$RUNNER_TEMP/cert.p12")"
          test "$size" -gt 1000 || {
            echo "::error::decoded p12 is only ${size} bytes — the secret is truncated or not a p12"
            exit 1
          }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # The p12 carries the leaf + key but not Apple's intermediate; without
          # it codesign cannot build a chain to the root on a clean runner.
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN" -T /usr/bin/codesign || true

          # Without this codesign blocks on a GUI authorization prompt forever.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"

          rm -f "$RUNNER_TEMP/cert.p12"
          # find-identity exits 0 even when it finds nothing; fail here rather
          # than five minutes into electron-builder.
          security find-identity -v -p codesigning "$KEYCHAIN" | tee /tmp/ids
          grep -q "Developer ID Application: Parasition AB" /tmp/ids

      - name: Build, sign and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # The Google Tasks sign-in client. `npm run build` writes these into the
          # gitignored electron/google-client.json (scripts/google-client.cjs), so the
          # dmg carries them and the repository never does.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # Not `npm run package:mac` — that sources .env, which is gitignored and
        # absent here. The Apple vars above are what notarize-dmg.cjs reads.
        #
        # `--mac` with no target named: a target on the command line REPLACES the list in
        # package.json, and `--mac dmg` built the dmg alone — no zip, so a manifest the
        # updater could not act on. The dmg and the zip both come from package.json.
        run: |
          npm run build
          npx electron-builder --mac --publish never

      - name: Verify the dmg Gatekeeper will actually see
        run: |
          set -euo pipefail
          DMG="$(ls release/*.dmg)"
          # No --deep here: the dmg is a flat file, not a bundle.
          codesign --verify --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      # The manifest running apps poll. Squirrel.Mac installs from the zip, so a manifest
      # without one is an update nobody can take.
      - name: Verify the update manifest
        run: |
          set -euo pipefail
          test -f release/latest-mac.yml
          grep -q '\.zip' release/latest-mac.yml
          cat release/latest-mac.yml

      - uses: google-github-actions/auth@v2
        with:
          project_id: cleveland-464404-m0
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload to GCS
        run: |
          set -euo pipefail
          DMG="$(ls release/*.dmg)"

          # The versioned dmg and zip, plus their blockmaps — the updater downloads only
          # the blocks that changed when it can. Versioned names never change, so they
          # may cache.
          for f in release/*.dmg release/*.zip release/*.blockmap; do
            gcloud storage cp "$f" "gs://getbedrock-downloads/$(basename "$f")" \
              --cache-control="public, max-age=3600"
          done

          # What running apps poll to learn there is a newer version. Never cached: a
          # stale manifest is an update nobody hears about.
          gcloud storage cp release/latest-mac.yml "gs://getbedrock-downloads/latest-mac.yml" \
            --cache-control="no-cache, max-age=0"

          # Stable alias: site/nginx.conf redirects here, so a new version needs no
          # site redeploy.
          gcloud storage cp "$DMG" "gs://getbedrock-downloads/Bedrock-latest-arm64.dmg" \
            --cache-control="public, max-age=300"

          echo "shipped $(basename "$DMG")" >> "$GITHUB_STEP_SUMMARY"
